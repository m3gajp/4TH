<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedallasAtleta</title>
</head>
<body>
    <script>
        let nombre = prompt("Ingresa tu nombre");
        let age = parseInt(prompt("Ingresa tu edad"));
        let time = parseInt(prompt("Ingresa tu tiempo en segundos"));
        if (age < 18){
            if (time < 12){
                document.write(nombre+ " felicidades, mereces una medalla de oro");
            }if (time >= 12 && time <= 14){
                document.write(nombre+ " felicidades, mereces una medalla de plata");
            }else if (time > 14){
                document.write(nombre+ " felicidades, mereces una medalla de bronce");
            }
        }
        if (age >= 18){
            if(time < 11){
                document.write(nombre+ " felicidades, mereces una medalla de oro");
            }if (time >= 11 && time <= 13){
                document.write(nombre+ " felicidades, mereces una medalla de plata");
            }else if (time > 13){
                document.write(nombre+ " felicidades, mereces una medalla de bronce");
            }
        }
    </script>
</body>
</html>
