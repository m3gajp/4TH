<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>ClasificaciónEmpleado</title>
</head>
<body>
    <script>
        let nombre = prompt("Ingresa tu nombre");
        let years = parseInt(prompt("Ingresa tus años de experiencia"));
        let points = parseInt(prompt("Ingresa tu puntaje (0 a 100)"));
        if (years >= 5){
            if (points >=90){
                document.write(nombre+ " tu puntaje es excelente");
            }if (points >=75 && points <=89){
                document.write(nombre+ " tu puntaje es Muy Bueno");
            }else if(points <75){
            document.write(nombre+ "tu puntaje es Bueno");
            }
        }if (years <5){
            if (points >=90){
                document.write(nombre+ " tu puntaje es Prometedor");
            }if (points >=75 && points <=89){
                document.write (nombre+ "tu puntaje requiere estar en desarrollo");
            }else if(points <75){
                document.write(nombre + "tu puntaje requiere capacitación");  
            }
        }
    </script>
</body>
</html>
